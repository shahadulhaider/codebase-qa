[project]
name = "codebase-qa"
version = "0.1.0"
description = "Index a Git repository and answer questions about it with cited sources."
readme = "README.md"
authors = [
    { name = "Muhammad Shahadul Haider", email = "shahadul.haider@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
codebase-qa = "codebase_qa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
