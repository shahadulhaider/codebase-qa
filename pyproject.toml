[project]
name = "codebase-qa"
version = "0.1.0"
description = "Index a Git repository and answer questions about it with cited sources."
readme = "README.md"
authors = [
    { name = "Muhammad Shahadul Haider", email = "shahadul.haider@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "einops>=0.8.2",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0 segfaults under repeated query matching
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
]

[project.scripts]
codebase-qa = "codebase_qa.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/fixtures"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = ["model: downloads and runs real embedding or reranking models"]
# Chroma reports collections created without an embedding function as "legacy".
filterwarnings = ["ignore:legacy embedding function config:DeprecationWarning"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
