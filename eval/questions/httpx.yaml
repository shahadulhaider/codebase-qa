# Retrieval questions for encode/httpx, written from the source and docs at the
# pinned commit before any retrieval run. Gold targets name the file, and the
# symbol (a treesitter symbol path) when one function or class answers it.
# Where sync and async clients duplicate code, questions name the sync Client.
repo: https://github.com/encode/httpx.git
ref: 0.28.1
